[project]
name = "moveit-py"
version = "0.1.0"
description = "Upload/download directories to/from a MOVEit Transfer server, send and receive packages."
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "augiraud" }]
dependencies = [
    "requests>=2.34.2",
    "requests-toolbelt>=1.0.0",
]

[project.urls]
Repository = "https://github.com/augiraud/moveit-py"

[project.scripts]
moveit = "moveit_py.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
    "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.9"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "ANN", # type annotations
    "B",   # likely bugs
    "C4",  # comprehensions
    "C90", # complexity (mccabe)
    "I",   # import sorting
    "PL",  # pylint
    "RUF", # ruff-specific
    "S",   # security (bandit)
    "SIM", # simplifications
    "UP",  # modern Python syntax
]
ignore = ["PLR0911"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["moveit_py"]
branch = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
