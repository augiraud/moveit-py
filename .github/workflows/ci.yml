name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv/python
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        run: |
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -LsSf \
            https://github.com/astral-sh/uv/releases/download/0.13.7/uv-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/uv.tar.gz"
          echo "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83  $RUNNER_TEMP/uv.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - run: ./scripts/setup.sh

      - run: ./scripts/local_ci.sh

      - name: Sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1

      - name: Sonar (skipped)
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::Sonar skipped. To enable it, add a SONAR_TOKEN secret (see README)."
